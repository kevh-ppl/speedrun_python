[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["lib", "**/ejercicios"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "UP047"]  # UP047 pide syntax `def f[T]()` 3.12+, preferimos TypeVar explicito

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
timeout = 10
